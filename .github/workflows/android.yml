name: DuoFold CI

on:
  push:
    branches: ["**"]
    tags:
      - "v*"
      - "dev-*"
      - "dev/*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: duofold-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_PLATFORM_PACKAGE: platforms;android-37.2

jobs:
  check:
    name: Code check
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          ln -sfn android-37.2 "${ANDROID_HOME}/platforms/android-37"

      - run: chmod +x gradlew scripts/*.sh

      - name: Compile + unit tests
        run: ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest --stacktrace --no-daemon

  build-dev:
    name: Dev build
    if: github.ref_type == 'tag' && (startsWith(github.ref_name, 'dev-') || startsWith(github.ref_name, 'dev/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          ln -sfn android-37.2 "${ANDROID_HOME}/platforms/android-37"

      - run: chmod +x gradlew scripts/*.sh

      - name: Resolve version from tag
        run: ./scripts/resolve-version-from-tag.sh "${GITHUB_REF_NAME}"

      - name: Decode release keystore
        env:
          DUOFOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUOFOLD_RELEASE_KEYSTORE_BASE64 }}
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DUOFOLD_RELEASE_KEYSTORE_BASE64 DUOFOLD_RELEASE_STORE_PASSWORD DUOFOLD_RELEASE_KEY_ALIAS DUOFOLD_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (see docs/signing.md)"
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/duofold-release.jks"
          echo "${DUOFOLD_RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "DUOFOLD_RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Assemble signed APK
        env:
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          mkdir -p dist
          OUT="dist/DuoFold-${DUOFOLD_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-dev-${{ env.DUOFOLD_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release publish
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Install Android 17 SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          ln -sfn android-37.2 "${ANDROID_HOME}/platforms/android-37"

      - run: chmod +x gradlew scripts/*.sh

      - name: Resolve version from tag
        run: ./scripts/resolve-version-from-tag.sh "${GITHUB_REF_NAME}"

      - name: Decode release keystore
        env:
          DUOFOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUOFOLD_RELEASE_KEYSTORE_BASE64 }}
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DUOFOLD_RELEASE_KEYSTORE_BASE64 DUOFOLD_RELEASE_STORE_PASSWORD DUOFOLD_RELEASE_KEY_ALIAS DUOFOLD_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: $name (see docs/signing.md)"
              exit 1
            fi
          done
          KEYSTORE_PATH="${RUNNER_TEMP}/duofold-release.jks"
          echo "${DUOFOLD_RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "DUOFOLD_RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Assemble signed APK
        env:
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --stacktrace --no-daemon
          mkdir -p dist
          OUT="dist/DuoFold-${DUOFOLD_VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-release-${{ env.DUOFOLD_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DuoFold ${{ env.DUOFOLD_VERSION_NAME }}
          generate_release_notes: true
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
