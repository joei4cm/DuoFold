name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_PLATFORM_PACKAGE: platforms;android-37.2

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 platform + build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          # AGP resolves compileSdk=37 as platforms/android-37
          ln -sfn android-37.2 "${ANDROID_HOME}/platforms/android-37"

      - name: Grant execute permission
        run: chmod +x gradlew scripts/*.sh

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --no-daemon

  release:
    name: Signed release APK
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify release signing secrets
        env:
          DUOFOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUOFOLD_RELEASE_KEYSTORE_BASE64 }}
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in DUOFOLD_RELEASE_KEYSTORE_BASE64 DUOFOLD_RELEASE_STORE_PASSWORD DUOFOLD_RELEASE_KEY_ALIAS DUOFOLD_RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Add the DuoFold release keystore secrets (see docs/signing.md), then re-run."
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 17 platform + build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "${ANDROID_PLATFORM_PACKAGE}" "build-tools;${ANDROID_BUILD_TOOLS}" "platform-tools"
          ln -sfn android-37.2 "${ANDROID_HOME}/platforms/android-37"

      - name: Grant execute permission
        run: chmod +x gradlew scripts/*.sh

      - name: Decode release keystore
        env:
          DUOFOLD_RELEASE_KEYSTORE_BASE64: ${{ secrets.DUOFOLD_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="${RUNNER_TEMP}/duofold-release.jks"
          echo "${DUOFOLD_RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          chmod 600 "${KEYSTORE_PATH}"
          echo "DUOFOLD_RELEASE_STORE_FILE=${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Assemble signed release APK
        env:
          DUOFOLD_RELEASE_STORE_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_STORE_PASSWORD }}
          DUOFOLD_RELEASE_KEY_ALIAS: ${{ secrets.DUOFOLD_RELEASE_KEY_ALIAS }}
          DUOFOLD_RELEASE_KEY_PASSWORD: ${{ secrets.DUOFOLD_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: DuoFold-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
